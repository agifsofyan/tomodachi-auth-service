
name: CI/CD Auth Service

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Auth Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
      SECRET_KEY: test-secret
      REGION_API_BASE_URL: http://localhost
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ACCESS_TOKEN_EXPIRE_DAY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Alembic Migration
        run: uv run alembic upgrade head

      - name: Run Unit Tests
        run: uv run pytest -v

  build-and-push:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest
    needs: test

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: |
            ghcr.io/agifsofyan/auth-service:latest
            ghcr.io/agifsofyan/auth-service:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Tomodachi Auth Service
          cache-from: type=gha
          cache-to: type=gha,mode=max

  
  deploy:
    name: Update Infrastructure Manifest
    runs-on: ubuntu-latest
    needs: build-and-push

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v6
        with:
          repository: agifsofyan/tomodachi-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update Auth Service image
        working-directory: infra
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          MANIFEST="kubernetes/application/auth-service/deployment.yaml"

          sed -i -E \
            "s|(image:[[:space:]]*ghcr.io/agifsofyan/auth-service:).*|\1${IMAGE_TAG}|" \
            "$MANIFEST"

          echo "Updated image:"
          grep 'image:' "$MANIFEST"

      - name: Commit and push manifest
        working-directory: infra
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/application/auth-service/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "deploy(auth-service): ${SOURCE_COMMIT_SHORT} ${SOURCE_COMMIT_SUBJECT}" \
            -m "Source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT_SHA}" \
            -m "Image: ${IMAGE_TAG}"
            
          git push origin main

